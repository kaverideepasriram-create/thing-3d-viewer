<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Violet Moon Witch AR</title>

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
</script>

<style>
body {
  margin: 0;
  background: #100d1c;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
h1 { padding: 15px; }
model-viewer {
  width: 100%;
  height: 75vh;
  background: #201936;
}
p { padding: 10px; }
</style>
</head>
<body>

<h1>Violet Moon Witch AR</h1>

<model-viewer
src="../Violet_Witch.glb"
alt="Violet Moon Witch"
camera-controls
auto-rotate
autoplay
ar
ar-modes="webxr scene-viewer quick-look"
shadow-intensity="1"
exposure="1">

<button slot="ar-button">View Witch in AR</button>

</model-viewer>

<p>Drag to rotate. Pinch to zoom. Tap AR to view in your surroundings.</p>

</body>
</html>
