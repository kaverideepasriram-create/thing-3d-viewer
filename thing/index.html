
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#241024">
  <title>My 3D Thing | AR Viewer</title>

  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #fff5e5;
      background: linear-gradient(145deg, #25102e, #a34d24, #180d20);
    }

    header {
      padding: 24px 16px 12px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(26px, 5vw, 38px);
    }

    p {
      line-height: 1.6;
    }

    model-viewer {
      display: block;
      width: 100%;
      height: 70vh;
      min-height: 350px;
      background: transparent;
      --poster-color: transparent;
    }

    .hint {
      padding: 12px 18px 24px;
      font-size: 14px;
    }

    .status {
      padding: 8px 12px;
      font-size: 14px;
    }

    .ar-button {
      background: #fff3d6;
      color: #35152c;
      border: none;
      border-radius: 24px;
      padding: 14px 22px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .ar-button:focus-visible {
      outline: 3px solid white;
      outline-offset: 3px;
    }
  </style>
</head>

<body>
  <header>
    <h1>My 3D Thing</h1>
    <p>Rotate, zoom, and explore your model in augmented reality.</p>
  </header>

  <div id="status" class="status" role="status" aria-live="polite">
    Loading your 3D model...
  </div>

  <model-viewer
    id="thing"
    src="../thing.glb"
    alt="Interactive 3D model"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    exposure="1"
    environment-image="neutral"
    interaction-prompt="auto">

    <button
      class="ar-button"
      slot="ar-button">
      View in AR
    </button>
  </model-viewer>

  <p class="hint">
    Drag to rotate, pinch to zoom, or tap View in AR on a compatible device.
  </p>

  <script>
    const viewer = document.getElementById("thing");
    const status = document.getElementById("status");

    viewer.addEventListener("load", () => {
      status.textContent = "3D model loaded successfully!";
    });

    viewer.addEventListener("error", () => {
      status.textContent =
        "Could not load the model. Check the GLB filename and file format.";
    });
  </script>
</body>
</html>
