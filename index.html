
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17121d">
  <title>Thing | 3D + AR</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #f8f3ff;
      text-align: center;
      background: linear-gradient(145deg, #211529, #49305f);
    }

    main {
      max-width: 800px;
      margin: auto;
    }

    h1 {
      font-size: clamp(30px, 7vw, 48px);
      margin: 16px 0;
    }

    p {
      line-height: 1.6;
      font-size: 17px;
    }

    .panel {
      margin: 24px auto;
      padding: 12px;
      background: white;
      border-radius: 24px;
      overflow: hidden;
    }

    model-viewer {
      display: block;
      width: 100%;
      height: 65vh;
      min-height: 380px;
      max-height: 650px;
      background: #f0f6ff;
      --poster-color: #f0f6ff;
    }

    .ar-button {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: #7650c9;
      color: white;
      border: 0;
      border-radius: 30px;
      padding: 15px 24px;
      font-size: 17px;
      font-weight: bold;
      white-space: nowrap;
    }

    .status {
      color: #e6d5ff;
      padding: 12px;
    }

    .help {
      font-size: 15px;
      color: #e3d5ed;
    }
  </style>
</head>

<body>
<main>
  <h1>THING: 3D + AR</h1>

  <p>
    Rotate Thing to explore the model.
    On your iPhone, tap View in AR to place it
    in your surroundings.
  </p>

  <section class="panel">
    <model-viewer
      id="thing"
      src="./thing.glb"
      alt="Thing, the stitched hand"
      camera-controls
      auto-rotate
      camera-orbit="0deg 75deg 2.5m"
      field-of-view="30deg"
      ar
      ar-modes="quick-look webxr scene-viewer"
      ar-placement="floor"
      ar-scale="auto"
      loading="eager"
      reveal="auto"
      shadow-intensity="1">

      <button slot="ar-button" class="ar-button">
        View in AR
      </button>
    </model-viewer>
  </section>

  <p id="status" class="status">
    Loading Thing...
  </p>

  <p class="help">
    iPhone: open this published website in Safari.
    Tap View in AR and follow the instructions.
    Move your phone slowly to scan the surrounding area.
  </p>
</main>

<script>
  const viewer = document.getElementById("thing");
  const status = document.getElementById("status");

  viewer.addEventListener("load", () => {
    status.textContent = "Thing loaded successfully!";
  });

  viewer.addEventListener("error", () => {
    status.textContent =
      "The model could not load. Check that thing.glb is in the same folder.";
  });
</script>
</body>
</html>
