
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cute Ghost Halloween AR</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #fff7ff;
      background: linear-gradient(145deg, #241038, #633b85, #170d28);
    }

    header {
      padding: 20px 12px 8px;
    }

    h1 {
      margin: 8px 0;
      font-size: clamp(25px, 5vw, 38px);
    }

    p {
      line-height: 1.5;
    }

    #status {
      min-height: 28px;
      padding: 4px 12px;
      font-size: 14px;
    }

    model-viewer {
      display: block;
      width: 100%;
      height: 70vh;
      min-height: 350px;
      max-height: 720px;
      background: transparent;
      --poster-color: transparent;
    }

    .hint {
      padding: 12px 16px 24px;
      font-size: 14px;
    }

    .ar-button {
      border: 0;
      border-radius: 24px;
      padding: 13px 22px;
      background: #f0d7ff;
      color: #28133b;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <header>
    <h1>Cute Ghost</h1>
    <p>A little Halloween magic for your room!</p>
  </header>

  <div id="status" role="status" aria-live="polite">
    Loading your ghost...
  </div>

  <model-viewer
    id="ghost"
    src="../cute%20ghost.glb"
    alt="Cute Halloween ghost"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate
    camera-orbit="0deg 70deg 100%"
    orientation="0deg 0deg 0deg"
    shadow-intensity="1">

    <button slot="ar-button" class="ar-button">
      View Ghost in AR
    </button>

  </model-viewer>

  <p class="hint">
    Drag to rotate, use two fingers to zoom,
    or tap View Ghost in AR on a compatible device.
  </p>

<script>
  const ghost = document.getElementById("ghost");
  const status = document.getElementById("status");

  ghost.addEventListener("load", () => {
    status.textContent = "Ghost loaded successfully!";
  });

  ghost.addEventListener("error", () => {
    status.textContent = "Could not load the ghost. Check the GLB file.";
  });
</script>

</body>
</html>
