
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halloween Kuromi AR</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      color: white;
      background: linear-gradient(160deg, #180d2c, #472267, #100d1b);
    }

    h1 { padding-top: 24px; }

    model-viewer {
      width: 100%;
      height: 65vh;
      background: transparent;
    }

    p { padding: 0 18px; color: #e5d3ff; }
  </style>
</head>

<body>
  <h1>Halloween Kuromi</h1>
  <p>Meet Kuromi in your own space!</p>

  <model-viewer
  src="../halloween-kuromi.glb"
  alt="Halloween Kuromi 3D model"
  camera-controls
  auto-rotate
  ar
  ar-modes="webxr scene-viewer quick-look"
  ar-placement="floor"
  shadow-intensity="1"
  style="width:100%;height:65vh;">

  <button slot="ar-button"
    style="position:absolute;bottom:16px;left:50%;
    transform:translateX(-50%);padding:14px 22px;
    background:#ff70b7;color:#1b1030;border:0;
    border-radius:24px;font-weight:bold;cursor:pointer;">
    View Kuromi in AR
  </button>

</model-viewer>

  <p>Drag to rotate, pinch to zoom, or tap the AR icon to try AR.</p>
</body>
</html>
