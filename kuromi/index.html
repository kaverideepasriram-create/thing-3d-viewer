
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kuromi AR</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f7e8ff, #e8ddff);
      color: #38234b;
      text-align: center;
    }

    header {
      padding: 22px 12px 8px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    p {
      padding: 0 15px;
    }

    model-viewer {
      width: 100%;
      height: 65vh;
      min-height: 350px;
      background: transparent;
      --poster-color: transparent;
    }

    .hint {
      font-size: 14px;
      margin: 5px 12px 18px;
    }

    .ar-button {
      background: #6e3d9c;
      color: white;
      border: none;
      border-radius: 25px;
      padding: 15px 28px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin: 12px;
    }

    .ar-button:active {
      background: #4d2676;
    }

    footer {
      font-size: 12px;
      padding: 15px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Kuromi AR</h1>
    <p>Meet Kuromi in your own space!</p>
  </header>

  <model-viewer
    id="kuromi"
    src="../halloween-kuromi.glb"
    alt="3D Kuromi character"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    shadow-intensity="1"
    exposure="1"
    scale="2 2 2"
    camera-orbit="0deg 75deg 105%"
    min-camera-orbit="auto auto 0.5m"
    max-camera-orbit="auto auto 10m"
    ar
    ar-modes="quick-look scene-viewer webxr"
    ar-scale="auto"
    ar-placement="floor">

    <button slot="ar-button" class="ar-button">
      View Kuromi in AR
    </button>

  </model-viewer>

  <p class="hint">
    Drag to rotate. Pinch to zoom. Tap the AR button
    to place Kuromi in your room.
  </p>

  <footer>Made with love for the Kuromi AR project</footer>
</body>
</html>
