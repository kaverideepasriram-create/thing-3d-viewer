<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halloween Kuromi AR</title>

  <!-- Google <model-viewer> web component -->
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(145deg, #28113f, #54266e, #160c20);
      color: white;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    header {
      padding: 24px 12px 8px;
    }

    h1 {
      font-size: 32px;
      margin: 8px 0;
      color: #ff65b5;
    }

    p {
      color: #eadcf5;
      padding: 0 16px;
    }

    model-viewer {
      display: block;
      width: 100%;
      height: 60vh;
      min-height: 380px;
      position: relative;
      --poster-color: transparent;
    }

    /* Fixed positioning so the custom AR button displays clearly over the model canvas */
    .ar-button {
      background: #ff65b5;
      color: #291038;
      border: none;
      border-radius: 28px;
      padding: 16px 28px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0px 4px 15px rgba(255, 101, 181, 0.4);
      transition: background 0.2s ease, transform 0.2s ease;
      white-space: nowrap;
    }

    .ar-button:active {
      transform: translateX(-50%) scale(0.96);
    }

    .hint {
      font-size: 14px;
      line-height: 1.6;
      padding-bottom: 24px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Halloween Kuromi</h1>
    <p>Bring Kuromi into your world!</p>
  </header>

  <model-viewer
    id="kuromi"
    src="../halloween-kuromi.glb"
    alt="Halloween Kuromi 3D model"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    rotation-per-second="15deg"
    scale="20 20 20"
    camera-target="auto auto auto"
    camera-orbit="0deg 75deg auto"
    field-of-view="30deg"
    shadow-intensity="1"
    exposure="1"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="auto"
    ar-placement="floor">

    <button slot="ar-button" class="ar-button">
      👻 View Kuromi in AR
    </button>

  </model-viewer>

  <p class="hint">
    Drag to rotate. Pinch to zoom.<br>
    Tap <b>View Kuromi in AR</b> to place her in your room!
  </p>
</body>
</html>
