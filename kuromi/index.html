
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Halloween Kuromi AR</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(145deg, #28113f, #54266e, #160c20);
      color: white;
      text-align: center;
    }

    header {
      padding: 24px 12px 10px;
    }

    h1 {
      font-size: 32px;
      margin: 8px 0 14px;
    }

    p {
      color: #eadcf5;
      padding: 0 16px;
    }

    model-viewer {
      display: block;
      width: 100%;
      height: 65vh;
      min-height: 380px;
      --poster-color: transparent;
    }

    .ar-button {
      background: #ff65b5;
      color: #291038;
      border: none;
      border-radius: 28px;
      padding: 17px 26px;
      font-size: 17px;
      font-weight: bold;
      margin: 12px;
      cursor: pointer;
    }

    .hint {
      font-size: 14px;
      line-height: 1.6;
      padding: 0 18px 24px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Halloween Kuromi</h1>
    <p>Meet Kuromi in your own space!</p>
  </header>

  <model-viewer
    id="kuromi"
    src="../halloween-kuromi.glb"
    alt="Halloween Kuromi 3D model"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    rotation-per-second="15deg"
    camera-orbit="0deg 75deg 3.5m"
    field-of-view="30deg"
    scale="2.5 2.5 2.5"
    shadow-intensity="1"
    exposure="1"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="auto"
    ar-placement="floor">

    <button slot="ar-button" class="ar-button">
      View Kuromi in AR
    </button>

  </model-viewer>

  <p class="hint">
    Drag to rotate and pinch to zoom.
    Tap View Kuromi in AR to place her in your room.
    Move your phone slowly to detect the floor.
    Pinch to resize Kuromi while in AR if supported.
  </p>
</body>
</html>
