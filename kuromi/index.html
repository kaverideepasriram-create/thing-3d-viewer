
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kuromi AR</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      color: white;
      background: linear-gradient(145deg, #28113f, #54266e, #160c20);
    }

    header {
      padding: 24px 12px 8px;
    }

    h1 {
      color: #ff65b5;
      font-size: 32px;
    }

    model-viewer {
      display: block;
      width: 100%;
      height: 65vh;
      min-height: 380px;
      --poster-color: transparent;
    }

    .ar-button {
      background: #ff65b5;
      color: #291038;
      border: none;
      border-radius: 28px;
      padding: 16px 24px;
      font-size: 17px;
      font-weight: bold;
    }

    #status {
      padding: 10px;
      color: #eadcf5;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Kuromi AR</h1>
    <p>Bring Kuromi into your world!</p>
  </header>

  <model-viewer
    id="kuromi"
    src="../kuromi_from_onegai_my_melody%20(1).glb"
    alt="Kuromi 3D model"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    exposure="1"
    ar
    ar-modes="quick-look webxr scene-viewer"
    ar-scale="auto">

    <button slot="ar-button" class="ar-button">
      View Kuromi in AR
    </button>

  </model-viewer>

  <p id="status">Loading Kuromi...</p>

  <script>
    const model = document.getElementById("kuromi");
    const status = document.getElementById("status");

    model.addEventListener("load", () => {
      status.textContent = "Kuromi loaded successfully!";
    });

    model.addEventListener("error", () => {
      status.textContent =
        "Kuromi could not load. Check the filename and file path.";
    });
  </script>
</body>
</html>
