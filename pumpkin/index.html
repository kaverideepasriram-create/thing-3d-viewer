
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Halloween Pumpkin AR</title>

  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #fff5e5;
      background: linear-gradient(145deg, #351507, #b95316, #241024);
    }

    header {
      padding: 20px 12px 8px;
    }

    h1 {
      margin: 8px 0;
      font-size: clamp(24px, 5vw, 36px);
    }

    p {
      padding: 0 12px;
      line-height: 1.5;
    }

    model-viewer {
      display: block;
      width: 100%;
      height: 70vh;
      min-height: 350px;
      background: transparent;
      --poster-color: transparent;
    }

    .ar-button {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 24px;
      border: 0;
      border-radius: 24px;
      background: #ffb347;
      color: #241000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    footer {
      padding: 12px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Halloween Pumpkin</h1>
    <p>Bring a little Halloween magic into your space!</p>
  </header>

  <model-viewer
    id="pumpkin"
    src="../jack-o-lantern_low-poly.glb"
    alt="Three-dimensional Halloween jack-o-lantern pumpkin"
    camera-controls
    auto-rotate
    rotation-per-second="20deg"
    camera-orbit="0deg 75deg 105%"
    field-of-view="30deg"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="auto"
    shadow-intensity="1"
    exposure="1"
    loading="eager">

    <button class="ar-button" slot="ar-button">
      View Pumpkin in AR
    </button>

    <p slot="error">
      The pumpkin could not load. Please check the model file and refresh.
    </p>
  </model-viewer>

  <footer>
    Drag to rotate, use two fingers to zoom, or tap View Pumpkin in AR
    on a compatible device.
  </footer>
</body>
</html>
