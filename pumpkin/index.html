
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halloween Pumpkin AR</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #fff5e5;
      background: linear-gradient(145deg, #b95316, #241024);
    }

    header { padding: 20px 12px 8px; }

    h1 { margin: 8px 0; }

    #status {
      padding: 12px;
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    model-viewer {
      display: block;
      width: 100%;
      height: 65vh;
      min-height: 320px;
      background: transparent;
      --poster-color: transparent;
    }

    .ar-button {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 22px;
      border: 0;
      border-radius: 24px;
      background: #ffb347;
      color: #241000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    footer { padding: 12px; }
  </style>
</head>

<body>
  <header>
    <h1>Halloween Pumpkin</h1>
    <p>Bring a little Halloween magic into your space!</p>
  </header>

  <div id="status" role="status">
    Loading pumpkin model...
  </div>

  <model-viewer
    id="pumpkin"
    src="./halloween_pumpkin.glb?v=2"
    alt="3D Halloween pumpkin"
    camera-controls
    auto-rotate
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    shadow-intensity="1"
    exposure="1"
    loading="eager">

    <button class="ar-button" slot="ar-button">
      View Pumpkin in AR
    </button>
  </model-viewer>

  <footer>
    Drag to rotate and zoom, or try AR on a compatible device.
  </footer>

  <script>
    const model = document.getElementById("pumpkin");
    const status = document.getElementById("status");

    model.addEventListener("load", () => {
      status.textContent = "Pumpkin loaded successfully!";
    });

    model.addEventListener("error", () => {
      status.textContent =
        "MODEL ERROR: The pumpkin could not load. Check the file URL and GLB format.";
    });

    model.addEventListener("ar-status", (event) => {
      status.textContent = "AR status: " + event.detail.status;
    });

    model.addEventListener("progress", (event) => {
      if (event.detail.totalProgress < 1) {
        status.textContent =
          "Loading pumpkin: " +
          Math.round(event.detail.totalProgress * 100) + "%";
      }
    });
  </script>
</body>
</html>
