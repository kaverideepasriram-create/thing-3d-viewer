
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Harry Potter AR</title>

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
</script>

<style>
body {
  margin: 0;
  background: #100d1c;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  padding: 15px;
}

model-viewer {
  width: 100%;
  height: 75vh;
  background: #201936;
}

p {
  padding: 10px;
}
</style>
</head>

<body>

<h1>Harry Potter AR</h1>

<model-viewer
src="../Harry_Potter_AR_1.5m.glb"
alt="Animated Harry Potter character"
camera-controls
auto-rotate
autoplay
ar
ar-modes="webxr scene-viewer quick-look"
shadow-intensity="1"
exposure="1">
<button slot="ar-button">
View Harry Potter in AR
</button>

</model-viewer>

<p>Drag to rotate. Pinch to zoom. Tap the AR button to view in your surroundings.</p>

</body>
</html>
